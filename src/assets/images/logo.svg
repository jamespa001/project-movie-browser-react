<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 70" width="80" height="70">
  <defs>
    <style>
      .arc-path {
        fill: none;
        stroke: url(#swooshGrad);
        stroke-width: 2.5;
        stroke-linecap: round;
        filter: url(#glow);
      }
      .plus-bar {
        fill: url(#plusGrad);
      }
    </style>

    <!-- Cyan to Blue Gradient for Plus Symbol -->
    <linearGradient id="plusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>

    <!-- Disney Orbital Swoosh Arc Gradient -->
    <linearGradient id="swooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#70F3FF" stop-opacity="1" />
    </linearGradient>

    <!-- Glow Effect for Swoosh -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Disney-style Orbital Swoosh Arc -->
  <path
    class="arc-path"
    d="M 4 62 C 18 12, 50 10, 70 24"
  />

  <!-- Star Sparkle Flare at Arc Peak -->
  <g transform="translate(70, 24)">
    <path
      d="M 0 -8 L 1.8 -2.2 L 8 0 L 1.8 2.2 L 0 8 L -1.8 2.2 L -8 0 L -1.8 -2.2 Z"
      fill="#FFFFFF"
    />
  </g>

  <!-- Gradient "+" Symbol -->
  <g transform="translate(38, 22)">
    <!-- Vertical Bar -->
    <rect x="10" y="0" width="6" height="26" rx="3" class="plus-bar" />
    <!-- Horizontal Bar -->
    <rect x="0" y="10" width="26" height="6" rx="3" class="plus-bar" />
  </g>
</svg>
